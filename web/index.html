<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bank Sampah Parepare">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bank Sampah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bank Sampah Parepare</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Automatic Cache Cleaner & Service Worker Purge
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    })();

    // Global Interactive Cache Cleaner
    window.clearAppCacheAndReload = function() {
      var btn = document.getElementById('cache-cleaner-btn');
      if (btn) {
        btn.style.background = '#047857';
        btn.innerHTML = '<span>⏳ Membersihkan...</span>';
      }

      var tasks = [];
      if ('serviceWorker' in navigator) {
        tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r) { return r.unregister(); }));
        }));
      }
      if ('caches' in window) {
        tasks.push(caches.keys().then(function(names) {
          return Promise.all(names.map(function(n) { return caches.delete(n); }));
        }));
      }

      Promise.all(tasks).finally(function() {
        try {
          sessionStorage.clear();
        } catch (e) {}
        var freshUrl = window.location.origin + window.location.pathname + '?v=' + Date.now();
        window.location.replace(freshUrl);
      });
    };
  </script>
</head>
<body>
  <!-- Floating Cache Clearer Button -->
  <div id="cache-cleaner-btn" onclick="clearAppCacheAndReload()" title="Klik untuk membersihkan cache dan memuat versi terbaru aplikasi" style="position:fixed;bottom:14px;right:14px;z-index:999999;background:linear-gradient(135deg, #166534, #268b07);color:#ffffff;border:1px solid rgba(255,255,255,0.3);border-radius:24px;padding:7px 14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;transition:transform 0.15s, opacity 0.15s;" onmouseover="this.style.opacity='1';this.style.transform='scale(1.05)'" onmouseout="this.style.opacity='0.9';this.style.transform='scale(1)'">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    <span>Bersihkan Cache</span>
  </div>

  <script src="flutter_bootstrap.js?v=20261015_02" async></script>
</body>
</html>
